# 项目（实体）清单。链条的第一环：数据源/功能 → 项目 → 问题/价值/需求 → 任务。
#
# 每个项目是一个封闭沙盒：它的分析、问题、价值、需求与任务只能使用属于它自己的
# 数据源与功能；跨项目混用是硬错误。
#
# id 必须与任务库 entities.entity_id 一致（任务库里已有的项目会被直接复用）。
# description 选填：一句话说明这个项目是什么。
#
# 数据源/功能归属写在 config/preflight_sources.yml 的每个条目上（entities 字段）。
projects:
  - id: portfolio_moomoo
    name: moomoo 实盘 ***57
    domain: quant_trading
    description: moomoo/OpenD FUTUSG 账户持仓与成交（只读）
  - id: portfolio_ibkr
    name: IBKR 实盘
    domain: quant_trading
    description: 盈透实盘账户，唯一由 Ten 信号驱动下单
  - id: strategy_ten
    name: Ten-Ticker V1 策略
    domain: quant_trading
    description: Al-Ten-Ticker-V1 信号、回测结果与自检
  - id: strategy_fifteen
    name: Fifteen-Ticker V1 策略
    domain: quant_trading
    description: Al-Fifteen-Ticker-V1 信号、结果与自检（不驱动 IBKR）
  - id: data_pipeline
    name: Update_Data_Script 数据管线
    domain: codebase
    description: 每日行情数据更新脚本与数据看板（launchd 定时）
  - id: ai_video_prompts
    name: FRAME-WORLD AI 视频提示词
    domain: creative_content
    description: 分镜提示词 V6.x、模型包与 AI-Video-and-Image-Prompts 仓库
  - id: novel_xianxia
    name: 小说·仙侠
    domain: creative_content
    description: 仙侠作品（世界观脑图、时序、角色、正文）
  - id: novel_yujin
    name: 小说·余烬星海
    domain: creative_content
    description: 科幻作品余烬星海（大纲、完整世界观、正文）
  - id: system_canmou
    name: 参谋系统自身
    domain: 元管理
    description: 参谋自身的资源归属、功能清单、数据源映射等系统层需求
