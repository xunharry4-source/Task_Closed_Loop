    result_summary: "Mailbox observation returned two concrete messages; no business tasks are pre-authored in this fixture."
    evidence_refs:
      - gmail:message:quote-001
      - gmail:message:contract-002
    subject_refs:
      - gmail:message:quote-001
      - gmail:message:contract-002
    payload:
      observed_messages:
        - message_id: quote-001
          sender: buyer@example.com
          subject: "Revise quotation before tomorrow 15:00"
          body: "Please revise our quotation for 500 units. We need the unit price changed from 12.50 to 11.90 and the revised quotation back before tomorrow at 15:00."
        - message_id: contract-002
          sender: legal@example.com
          subject: "Contract signature page missing"
          body: "The contract package you returned is missing the signed signature page. Please correct the package today."

