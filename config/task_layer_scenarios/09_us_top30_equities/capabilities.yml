schema_version: "1.0"
producer: "manual-scenario-fixture"

capabilities:
  - id: market_data_read
    provider_id: local-market-data
    action_type: query_timeseries
    description: 读取本地美股前 30 日线库的当前状态，可列标的、按区间查询、读最新快照
    principal: local-analyst
    security_domain: local-market-data
    availability: available
    permissions: [list_symbols, query_range, read_latest]
    target_scope:
      dataset: us_top30_daily
    can_observe_state: true
    observable_state: us_equity_daily_current_state
    observation_operations: [list_symbols, query_range, read_latest]

  - id: codex_compute
    provider_id: codex-cli
    action_type: code_execution_analysis
    description: >-
      Codex 能编写并运行 Python 代码对已提供的数据做计算、统计、回测与图表产出，
      只作用于已经取得的数据，不具备联网或访问未授权数据源的能力
    principal: local-analyst
    security_domain: local-compute
    availability: available
    permissions: [write_code, run_code, produce_report]
    can_observe_state: false
    observation_operations: []
