schema_version: "1.0"
producer: "manual-task-layer-scenario"
capabilities:
  - id: postgres_read
    action_type: query_database
    availability: available
    permissions: [list_schema, query, read_rows]
    can_observe_state: true
    observable_state: postgres_production_current_state
    observation_operations: [list_schema, query, read_rows]
  - id: python_analysis
    action_type: analyze_data
    availability: available
    permissions: [analyze]
    can_observe_state: false
    observation_operations: []
