# 第一步：你只配三件事——工作目录、功能、用哪个 CLI。
#
# 其余一切由第二步分析得出：资源 id 由目录名生成，"这是什么、现在有什么、到什么程度"
# 由分析写进资源的 summary，功能是否可用由分析实测。
# 需要凭据的功能，凭据只放 cli_project/.env，这里不写。
preflight_inputs:
  enabled: true

  # 用哪个 CLI：codex（chatgpt）/ gemini / claude
  cli: ${PREFLIGHT_CLI:codex}

  # 第二步（分析并填模版）什么时候执行——它本来就是初始化数据：
  #   auto   默认。指定目录里没有这一项的数据才跑；已经有了就跳过。
  #          新增一个目录/功能时，只初始化新增的那一项。
  #   always 手动触发：全部重新初始化
  #   never  从不执行，只用已保存的数据
  analyze: ${PREFLIGHT_ANALYZE:auto}

  # 工作目录，可多个，只写路径
  directories:
    - /Users/harry/Documents/trading_data
    - /Users/harry/Documents/world

  # 功能，可多个，只写名字
  functions:
    - codex
    - gemini
    - claude
    - moomoo
    - ibkr
