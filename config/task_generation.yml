# Task Generation Core 配置
# Task Generation 与 R1-R5 Offline Diagnostics 独立。

task_generation:
  discovery:
    prompt: src/task_closed_loop/prompts/task_discovery.md

  candidate_destructive_audit:
    prompt: src/task_closed_loop/prompts/task_candidate_destructive_audit.md

  candidate_set_audit:
    prompt: src/task_closed_loop/prompts/task_candidate_set_audit.md

  finalizer:
    # Finalizer 使用 Python 确定性转换，保持审查后的 Candidate 字段。
    mode: deterministic

  fidelity_audit:
    enabled: true

  reality_validity_audit:
    enabled: true

  zero_task:
    enabled: true
