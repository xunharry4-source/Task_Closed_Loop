task_generation:
  # Stage 3-7 的固定生产顺序：
  #   3 首次生成 -> 4 审查 -> 5 数量检查 -> (6 维度 -> 7 重生成 -> 回到 4)
  # max_rounds 只限制 5<->7 的补充轮数，不是最终 Task 数量上限。
  production_pipeline:
    enabled: true
    max_rounds: ${TASK_PIPELINE_MAX_ROUNDS:3}
  # 生成任务的第一步（Stage 3）走哪条链：
  #   skill_chain       数据源/功能 → 项目 → 问题/价值/需求 → 主题 → 任务（每个项目各跑一条流水线）
  #   legacy_discovery  旧链条：发现 → 任务想法 → 候选任务（单一全局 reality）
  # Stage 4 审查、Stage 5 数量检查、Stage 6/7 与产物保存两种模式下都不变。
  first_step:
    mode: ${TASK_FIRST_STEP_MODE:skill_chain}
  need_opportunity_discovery:
    enabled: true
    prompt: src/task_closed_loop/prompts/need_opportunity_discovery.md
  task_proliferation:
    enabled: true
    require_observed_outcome: true
    max_inline_outcome_payload_bytes: 65536
    max_total_outcome_payload_bytes: 262144
    prompt: src/task_closed_loop/prompts/task_proliferation.md
  discovery:
    prompt: src/task_closed_loop/prompts/task_discovery.md
  candidate_destructive_audit:
    prompt: config/prompts/task_candidate_destructive_audit.yml
  candidate_field_audit:
    prompt: config/prompts/task_candidate_field_audit.yml
  candidate_set_audit:
    prompt: config/prompts/task_candidate_set_audit.yml
  finalizer:
    mode: deterministic
  fidelity_audit:
    enabled: true
  reality_validity_audit:
    enabled: true
  zero_task:
    enabled: true
  coverage_expansion:
    enabled: true
    min_qualified_tasks: 5
