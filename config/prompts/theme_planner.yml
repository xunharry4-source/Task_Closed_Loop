# 这个文件分两部分：
#   给用户看的：说明 / 变量          —— 系统完全不读，爱写多少写多少
#   给系统用的：设置 / 提示词        —— 系统只读这两个
#
# 变量由系统提供（见 src/task_closed_loop/llm/prompt_template.py 的 VARIABLES），你只管用：
# 把 {{变量名}} 放到提示词正文的任何位置，本轮的真实内容就替换在那个位置；
# 调整它在正文里的位置，就等于调整提示词——替换照旧正确。
角色: theme_planner
说明: |
  第四步：整理这个项目的资源信息，并给出这一轮要问的主题（5 个固定主题 + 2–5 个推导主题），每个主题要带来源。
  共享段（引用语法）：stage_io_contract
变量:
  "{{功能}}": 可用功能：每条是功能名 function + identity（谁开发的、什么类型的工具），不含「能做什么」（英文别名 {{capabilities}}）
  "{{需求}}": 本项目本轮生成的需求：现有功能覆盖不了的能力缺口（英文别名 {{capability_voids}}）
  "{{固定主题}}": Host 给定的固定主题：优化·推进·收益·探针·破局（英文别名 {{fixed_themes}}）
  "{{上轮主题产出}}": 上一轮各主题各产出了多少任务，用来决定推导主题换不换（英文别名 {{previous_theme_yield}}）
  "{{问题}}": 本项目本轮生成的问题（未知盲区 / 已知缺陷）（英文别名 {{problems}}）
  "{{项目}}": 这个项目：id、名称、一句话说明（它是干嘛的、现在什么情况）（英文别名 {{project}}）
  "{{资源}}": 本项目的资源：第四、五步只给 id + summary（现在有什么、到什么程度），审核与旧链条给完整分析结果（英文别名 {{resources}}）
  "{{价值}}": 本项目本轮生成的价值（全新方案 / 增量方案）（英文别名 {{value_opportunities}}）
  "{{输入}}": 特殊变量：本轮输入的全部内容（JSON）（英文别名 {{input}}）
  "{{引用语法}}": 特殊变量：共享的引用语法段（英文别名 {{reference_syntax}}）
  "{{角色}}": 特殊变量：角色名（英文别名 {{role}}）
设置:
  append_input: auto      # auto 默认（正文用了输入变量就不再追加【本轮输入】）/ always 总是追加 / never 从不追加
  includes: true          # true 默认：保留共享段 / false：不要

提示词: |
  # 主题规划

  项目：

  {{项目}}

  它的资源（id + 简介：现在有什么、到什么程度）：

  {{资源}}

  可用功能（名称 + 身份；能做什么按你的了解判断）：

  {{功能}}

  这个项目本轮刚生成的问题：

  {{问题}}

  本轮刚生成的价值：

  {{价值}}

  本轮刚生成的需求：

  {{需求}}

  你只做两件事：整理这个项目的【资源信息】，给出要问的主题。**不提问、不生成任务。**

  ## 主题要带来源

  每个主题写 `source_refs`：它覆盖了上面哪些问题/价值/需求（填它们的
  `problem_id` / `value_id` / `demand_id`）。后面生成任务时只看资源、功能、项目说明和主题，
  任务的来源就从主题这里继承——**没有 source_refs 的主题，它产出的任务无法入库。**

  ## 固定主题

  由 Host 给定的固定主题：

  {{固定主题}}

  把它们也写进 `themes` 并补上 `source_refs`，但不要改名。某个固定主题对这个项目明显毫无意义时
  写进 `skipped_fixed_themes` 并给理由——探针与破局永不省略。

  ## 推导主题

  再给 2–5 个本项目特有的主题，一个词或短语（如 数据时效、对账差异、伏笔回收），
  不与固定主题或彼此重复。

  上一轮各主题的产出数（高产出保留，连续无产出的换掉）：

  {{上轮主题产出}}

  ## 输出

  - `resource_info`：这个项目有哪些资源、现在什么情况
  - `themes`：`{theme, reason, source_refs}` 数组（固定 + 推导都放这里）
  - `skipped_fixed_themes`：`{theme, reason}` 数组，没有就空数组
