# 这个文件分两部分：
#   给用户看的：说明 / 变量          —— 系统完全不读，爱写多少写多少
#   给系统用的：设置 / 提示词        —— 系统只读这两个
#
# 变量由系统提供（见 src/task_closed_loop/llm/prompt_template.py 的 VARIABLES），你只管用：
# 把 {{变量名}} 放到提示词正文的任何位置，本轮的真实内容就替换在那个位置；
# 调整它在正文里的位置，就等于调整提示词——替换照旧正确。
角色: task_candidate_destructive_audit
说明: |
  第六步（单条·核心）：只判断这条候选任务的工作关系是否成立。
  字段写得好不好由下一步 task_candidate_field_audit 单独审。
  共享段（引用语法）：stage_io_contract
变量:
  "{{功能}}": 可用功能：每条是功能名 function + identity（谁开发的、什么类型的工具），不含「能做什么」（英文别名 {{capabilities}}）
  "{{未结任务}}": 本项目还没结束的任务，用来避免重复提同一件事（英文别名 {{open_tasks}}）
  "{{现实}}": 当前现实对象：reality_id + facts（六步流程里由 Host 直接拼出）（英文别名 {{reality}}）
  "{{资源}}": 本项目的资源：第四、五步只给 id + summary（现在有什么、到什么程度），审核与旧链条给完整分析结果（英文别名 {{resources}}）
  "{{待审任务}}": 正在审的那一条任务（第六步逐条审核）（英文别名 {{task_under_review}}）
  "{{输入}}": 特殊变量：本轮输入的全部内容（JSON）（英文别名 {{input}}）
  "{{引用语法}}": 特殊变量：共享的引用语法段（英文别名 {{reference_syntax}}）
  "{{角色}}": 特殊变量：角色名（英文别名 {{role}}）
设置:
  append_input: auto      # auto 默认（正文用了输入变量就不再追加【本轮输入】）/ always 总是追加 / never 从不追加
  includes: true          # true 默认：保留共享段 / false：不要

提示词: |
  # 单条审查：核心是否成立

  这条待审任务（另一个 AI 根据同一份现实形成的）：

  {{待审任务}}

  项目的资源：

  {{资源}}

  当前现实：

  {{现实}}

  可用功能：

  {{功能}}

  还没结束的任务：

  {{未结任务}}

  你**只判断任务核心是否成立**。不管 description / user_value / expected_result / steps 写得好不好——那是下一步的事。文案差不能当作核心无效。

  普通业务任务：`capability:<capability_id>` 只能说明某状态域可被观察，不能单独证明具体对象已存在。若 `based_on_refs` 只有 capability、没有已物化的 `resource:` / `reality:` / `task_outcome:`，判核心无效。

  引用格式与路径是否存在由 Host 校验；你判断的是被引用的内容是否真的支持这项工作。

  ## 可以推翻核心的情况

  - 误读资源的内容、范围、时间位置或来源性质
  - 仅因多个资源同时出现，就假定现实中没有的关联、因果、比较或共同目标
  - 把能力扩张成当前不存在的能力
  - 新增现实中不存在的事实、关系或结果责任
  - 只是由资源类型或能力名称机械套出的固定用途
  - 与上面未结任务承担同一 `task_key`
  - `work_to_do` 本身没有独立现实意义
  - 预期核心结果实际上不受当前资源、能力支持
  - 工作关系本身对用户没有足够实际价值（不是文案写得差）

  这些情况返回 `is_valid_work=false`。

  ## 输出

  只返回：

  - is_valid_work
  - challenge
  - evidence
  - reason

  不判断是否需要改写，不自己改写任务，不创造新任务。
