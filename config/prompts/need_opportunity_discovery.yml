# 这个文件分两部分：
#   给用户看的：说明 / 变量          —— 系统完全不读，爱写多少写多少
#   给系统用的：设置 / 提示词        —— 系统只读这两个
#
# 变量由系统提供（见 src/task_closed_loop/llm/prompt_template.py 的 VARIABLES），你只管用：
# 把 {{变量名}} 放到提示词正文的任何位置，本轮的真实内容就替换在那个位置；
# 调整它在正文里的位置，就等于调整提示词——替换照旧正确。
角色: need_opportunity_discovery
说明: |
  旧链条：发现需求与机会。
  共享段（引用语法）：stage_io_contract
变量:
  "{{历史任务}}": 本项目的全部历史任务（英文别名 {{all_tasks_history}}）
  "{{功能}}": 可用功能：每条是功能名 function + identity（谁开发的、什么类型的工具），不含「能做什么」（英文别名 {{capabilities}}）
  "{{未结任务}}": 本项目还没结束的任务，用来避免重复提同一件事（英文别名 {{open_tasks}}）
  "{{现实}}": 当前现实对象：reality_id + facts（六步流程里由 Host 直接拼出）（英文别名 {{reality}}）
  "{{资源}}": 本项目的资源：第四、五步只给 id + summary（现在有什么、到什么程度），审核与旧链条给完整分析结果（英文别名 {{resources}}）
  "{{输入}}": 特殊变量：本轮输入的全部内容（JSON）（英文别名 {{input}}）
  "{{引用语法}}": 特殊变量：共享的引用语法段（英文别名 {{reference_syntax}}）
  "{{角色}}": 特殊变量：角色名（英文别名 {{role}}）
设置:
  append_input: auto      # auto 默认（正文用了输入变量就不再追加【本轮输入】）/ always 总是追加 / never 从不追加
  includes: true          # true 默认：保留共享段 / false：不要

提示词: |
  # Need / Opportunity Discovery

  资源（原始现实内容）：

  {{资源}}

  当前现实（跨资源、跨轮次的关系）：

  {{现实}}

  还没结束的任务：

  {{未结任务}}

  历史任务：

  {{历史任务}}

  可用功能（只用来理解当前可行动范围，不限制"能发现什么"）：

  {{功能}}

  你的职责不是直接生成任务，而是先从当前现实中发现“用户现在可能真正需要处理、验证、利用或关注的独立现实关系”。

  这一层的输出叫 finding（发现）。它是任务之前的发现对象，不等于待办事项，也不要求当前一定能够执行。

  ### 观察类任务与本层的边界

  可观察能力（邮箱、文件库、数据库、CRM、Calendar、代码仓库、监控/工单等）的“先读取现实”动作不属于本层。Runtime 会先独立生成观察类父任务。

  本层只能根据**上面已经物化的资源与当前现实**发现问题、机会、风险或其它现实关系。

  因此：

  - `capability:<capability_id>` 不能作为 finding 的依据；能力只说明“能去看”，不说明“已经看到了什么”。
  - 不得因为存在 Gmail 就猜某个 sender、邮件、投诉或截止日期；也不得因为存在 Drive / Database / Calendar 就猜文件、记录或事件。
  - 观察父任务执行后，其真实 Outcome 才能成为后续发现与任务增殖的事实依据。
  - 如果观察结果确认没有相关对象，也允许没有任何 finding。

  ## 发现原则

  从现实本身出发，而不是从预制任务类型出发。

  可以发现的问题形态包括但不限于：机会、问题、风险、未利用资源、值得验证的未知关系、可形成决策价值的比较、当前状态与目标/约束之间的缺口。这里只是例子，不是分类表，不要求把发现强制塞进这些类别。

  正常、完整、没有异常的资源也可以产生有价值的发现。例如一组正常数据可能存在尚未利用的比较、分层、规律、决策价值或资源组合。

  不要因为当前没有合适能力就删除一个真实发现。本层负责回答“现实里有什么值得关注”，后续形成任务时才回答“当前系统能不能对此形成可执行任务”。

  不要把能力名称、资源类型、文件名直接映射成固定发现。

  多个资源只有在现实内容存在真实关系时才组合，不为了制造复杂度而强行拼接。

  上面那些未结任务已经完整覆盖同一现实工作关系时，不重复发现同义项；但如果新的当前现实暴露了不同的问题、机会或结果目标，可以形成新的 finding。

  ## 输出

  输出 `findings` 数组，每个 finding 输出：

  - `finding_id`
  - `finding_type`
  - `what_was_observed`
  - `why_it_matters_to_user`
  - `desired_outcome`
  - `why_it_is_separate`
  - `based_on_refs`
  - `related_capability_ids`

  字段含义：

  - `finding_type`：自由文本短标签，只用于帮助理解，不使用固定枚举。
  - `what_was_observed`：真正被发现的现实关系、状态、机会或问题是什么。
  - `why_it_matters_to_user`：为什么它可能值得用户关注，必须具体，不写“提高效率”这类空话。
  - `desired_outcome`：如果继续处理，最希望改变什么现实状态或得到什么答案。
  - `why_it_is_separate`：为什么它不是其它 finding / 已有任务的同义改写。
  - `based_on_refs`：依据的引用，必须按下文“引用语法”书写，且只能引用上面资源、当前现实里真实存在的内容；这一步不接受 `capability:`。
  - `related_capability_ids`：如果当前能力明显相关可以填写 `capability_id`；没有适合能力时允许为空。

  允许输出 0 个 finding。不要为了凑数量制造需求。
