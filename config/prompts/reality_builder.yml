# 这个文件分两部分：
#   给用户看的：说明 / 变量          —— 系统完全不读，爱写多少写多少
#   给系统用的：设置 / 提示词        —— 系统只读这两个
#
# 变量由系统提供（见 src/task_closed_loop/llm/prompt_template.py 的 VARIABLES），你只管用：
# 把 {{变量名}} 放到提示词正文的任何位置，本轮的真实内容就替换在那个位置；
# 调整它在正文里的位置，就等于调整提示词——替换照旧正确。
角色: reality_builder
说明: |
  旧链条：把资源压成一份"当前现实"。六步流程里已不用（现实由 Host 直接拼）。
  共享段（引用语法）：stage_io_contract
变量:
  "{{证据}}": 构建现实用的证据（英文别名 {{evidence}}）
  "{{执行变化}}": 执行带来的变化（英文别名 {{execution_deltas}}）
  "{{外部影响}}": 外部世界发生的影响（英文别名 {{external_effects}}）
  "{{相关历史}}": 相关历史记录（英文别名 {{related_history}}）
  "{{资源}}": 本项目的资源：第四、五步只给 id + summary（现在有什么、到什么程度），审核与旧链条给完整分析结果（英文别名 {{resources}}）
  "{{输入}}": 特殊变量：本轮输入的全部内容（JSON）（英文别名 {{input}}）
  "{{引用语法}}": 特殊变量：共享的引用语法段（英文别名 {{reference_syntax}}）
  "{{角色}}": 特殊变量：角色名（英文别名 {{role}}）
设置:
  append_input: auto      # auto 默认（正文用了输入变量就不再追加【本轮输入】）/ always 总是追加 / never 从不追加
  includes: true          # true 默认：保留共享段 / false：不要

提示词: |
  # 当前现实

  完整的资源分析结果：

  {{资源}}

  证据：

  {{证据}}

  外部影响：

  {{外部影响}}

  执行变化：

  {{执行变化}}

  相关历史：

  {{相关历史}}

  `facts` 要回答一句话：**现在有什么、到什么程度了。**

  - 有哪些数据/内容/成果，各自是关于什么的（例如：有哪些股票的什么数据；小说写到第几卷第几章，写的是什么）
  - 覆盖范围：时间区间、数量级、最新到什么时候
  - 当前进度与状态

  写成简要清单，**不要堆明细**——不逐个列字段、文件、样例值。后续步骤只看这份现实和资源简介，
  所以这里要让没见过原始数据的人读完就知道现在是什么情况。

  其余字段：

  - `gaps`：当前缺什么、哪里不清楚
  - `conflicts`：互相矛盾的证据
  - `evidence_refs` / `effect_refs`：稳定、可识别的对象引用（后续步骤会原样照抄引用它们）
  - `related_history_refs`、`object_relations`：与当前现实相关的历史与对象关系
  - `reality_id`：本轮现实的 id

  已有任务由后续步骤单独判断，这里只根据现实输入建立当前现实。
