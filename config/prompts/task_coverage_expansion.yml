# 这个文件分两部分：
#   给用户看的：说明 / 变量          —— 系统完全不读，爱写多少写多少
#   给系统用的：设置 / 提示词        —— 系统只读这两个
#
# 变量由系统提供（见 src/task_closed_loop/llm/prompt_template.py 的 VARIABLES），你只管用：
# 把 {{变量名}} 放到提示词正文的任何位置，本轮的真实内容就替换在那个位置；
# 调整它在正文里的位置，就等于调整提示词——替换照旧正确。
角色: task_coverage_expansion
说明: |
  第七步：通过审核的任务太少时，补出新的思考角度（每个角度会被当成一个新主题重新问一次）。
  共享段（引用语法）：stage_io_contract
变量:
  "{{已接受任务}}": 本轮已经通过审核的任务（英文别名 {{accepted_tasks_so_far}}）
  "{{功能}}": 可用功能：每条是功能名 function + identity（谁开发的、什么类型的工具），不含「能做什么」（英文别名 {{capabilities}}）
  "{{未结任务}}": 本项目还没结束的任务，用来避免重复提同一件事（英文别名 {{open_tasks}}）
  "{{现实}}": 当前现实对象：reality_id + facts（六步流程里由 Host 直接拼出）（英文别名 {{reality}}）
  "{{已拒绝任务}}": 本轮被拒绝的任务与原因（英文别名 {{rejected_tasks_so_far}}）
  "{{资源}}": 本项目的资源：第四、五步只给 id + summary（现在有什么、到什么程度），审核与旧链条给完整分析结果（英文别名 {{resources}}）
  "{{输入}}": 特殊变量：本轮输入的全部内容（JSON）（英文别名 {{input}}）
  "{{引用语法}}": 特殊变量：共享的引用语法段（英文别名 {{reference_syntax}}）
  "{{角色}}": 特殊变量：角色名（英文别名 {{role}}）
设置:
  append_input: auto      # auto 默认（正文用了输入变量就不再追加【本轮输入】）/ always 总是追加 / never 从不追加
  includes: true          # true 默认：保留共享段 / false：不要

提示词: |
  # Task Coverage Expansion

  项目的资源：

  {{资源}}

  当前现实：

  {{现实}}

  可用功能：

  {{功能}}

  还没结束的任务：

  {{未结任务}}

  本轮已经通过审查的任务：

  {{已接受任务}}

  本轮被拒绝的任务及原因：

  {{已拒绝任务}}

  这是弱模型的思考角度扩展层。

  它不生成任务，不生成任务想法，也不决定最终任务数量。

  只有首轮任务经过完整的单任务审查、集合审查后，合格任务少于配置阈值时，才调用本层。阈值只用于判断是否需要再次扩展思考角度，不是最终任务数量目标。

  上面那份被拒绝的任务，记录了已经探索但失败的方向、失败阶段（`stage`）、失败原因（`reason`、`structural_findings`）和措辞问题（`wording_problems`）。

  本层的目标不是重复首轮，而是找出**首轮没有充分展开的其它独立思考角度**。

  对于已经失败的方向：

  - 如果失败原因是“核心工作关系价值低、现实不成立、能力不支持”，避免换个说法重复同一方向
  - 如果失败原因只是措辞差，不把它误判为“需要一个全新的角度”；该任务会由改写步骤处理
  - 如果失败原因是引用格式或引用路径不存在（`structural_findings` 中写明了应该怎样引用），方向本身并未被否定；新角度可以沿用该方向，但必须按引用语法给出真实存在的依据
  - 只有能提出实质不同的问题空间、结果目标或现实关系时，才形成新角度

  思考角度只能从上面已经物化的资源与当前现实出发。可观察能力的“先去读什么状态域”已经由观察类任务层负责，本层不得再把 `capability:<capability_id>` 当成新的思考角度来源。

  思考角度可以来自：

  - 当前资源中另一种重要关系
  - 不同对象之间另一种值得比较的角度
  - 可以明显改变用户判断的其它分析维度
  - 当前能力可以把资源转化成的另一类高价值结果
  - 弱模型首轮容易忽略、但真实数据明确支持的问题空间

  输出 `new_angles` 数组，每个角度输出：

  - angle_id
  - angle
  - question_to_answer
  - why_valuable
  - why_it_is_separate
  - based_on_refs
  - related_capability_ids

  思考角度不是任务，不写 task_key，不写 steps，不直接输出最终任务。

  如果没有更多独立、有价值的思考角度，可以返回空数组：

  ```json
  {
    "new_angles": []
  }
  ```

  多个资源同时出现不是新的思考角度。只有它们在当前内容中存在真实关系时，才形成跨资源的角度；不要为了增加思考角度而把互不相关的资源拼接起来。
