# 推理用哪个模型：默认就是第一步 config/preflight_sources.yml 里配的那个 cli。
# 只有想让推理与第二步的分析用不同的东西时，才单独设 TASK_LLM_ADAPTER / AUDIT_LLM_ADAPTER。
llm:
  task:
    adapter: ${TASK_LLM_ADAPTER}
    model: ${TASK_LLM_MODEL}
    temperature: ${TASK_LLM_TEMPERATURE:0.0}
  audit:
    adapter: ${AUDIT_LLM_ADAPTER}
    model: ${AUDIT_LLM_MODEL}
    temperature: ${AUDIT_LLM_TEMPERATURE:0.0}
  prompt_manifest: src/task_closed_loop/prompts/manifest.yml
  gemini:
    api_key_env: GEMINI_API_KEY
  # Stage 3/4/6/7 走本地 gemini CLI 时使用。
  # CLI 认证独立于本项目：不向子进程传递任何项目凭据，
  # CLI 使用自己已登录的账号与独立配额。
  gemini_cli:
    command: ${GEMINI_CLI_COMMAND:gemini}
    # plan 需要 CLI 开启 experimental.plan，否则会告警并回退到 default。
    approval_mode: ${GEMINI_CLI_APPROVAL_MODE:default}
    timeout_seconds: ${GEMINI_CLI_TIMEOUT_SECONDS:300}
    max_retries: ${GEMINI_CLI_MAX_RETRIES:2}
  # Stage 3/4/6/7 走本地 codex CLI 时使用。
  # codex exec 用 --output-schema 原生约束结构，用 --output-last-message 取结果。
  # 注意：codex exec 失败时退出码仍为 0，成功与否以是否写出结果为准。
  codex_cli:
    command: ${CODEX_CLI_COMMAND:codex}
    sandbox: ${CODEX_CLI_SANDBOX:read-only}
    timeout_seconds: ${CODEX_CLI_TIMEOUT_SECONDS:600}
    max_retries: ${CODEX_CLI_MAX_RETRIES:2}
    # 任务推理不应受本地 execpolicy .rules 影响。
    ignore_rules: ${CODEX_CLI_IGNORE_RULES:true}
    ignore_user_config: ${CODEX_CLI_IGNORE_USER_CONFIG:false}
  gemma:
    thinking_level: ${GEMMA_THINKING_LEVEL:high}
    max_output_tokens: ${GEMMA_MAX_OUTPUT_TOKENS}
  ollama:
    base_url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    timeout_seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
    keep_alive: ${OLLAMA_KEEP_ALIVE:5m}
    think: ${OLLAMA_THINK:false}
  lmstudio:
    base_url: ${LMSTUDIO_BASE_URL:http://127.0.0.1:1234/v1}
    timeout_seconds: ${LMSTUDIO_TIMEOUT_SECONDS:120}
    max_tokens: ${LMSTUDIO_MAX_TOKENS}
    api_key: ${LMSTUDIO_API_KEY}
  roles:
    reality_builder: reality_builder
    project_discovery: project_discovery
    problem_discovery: problem_discovery
    value_discovery: value_discovery
    demand_discovery: demand_discovery
    theme_planner: theme_planner
    theme_task_generation: theme_task_generation
    existing_task_continuity: existing_task_continuity
    task_discovery: task_discovery
    task_candidate_audit: task_candidate_destructive_audit
    task_candidate_field_audit: task_candidate_field_audit
    task_candidate_set_audit: task_candidate_set_audit
    task_reality_validity: task_reality_validity
  openai:
    base_url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    timeout_seconds: ${OPENAI_TIMEOUT_SECONDS:120}
    max_tokens: ${OPENAI_MAX_TOKENS}
    api_key: ${OPENAI_API_KEY}
  # OpenRouter：一个 key 走很多家模型的网关（含 DeepSeek）。
  # key 写进项目根目录的 .env：OPENROUTER_API_KEY=...（.env 已在 .gitignore 里）
  # 模型名必须带厂商前缀，常用的 DeepSeek（2026-10 实时查到的在线型号）：
  #   deepseek/deepseek-v4.1-flash   1M 上下文，便宜，日常生成/审核够用（默认）
  #   deepseek/deepseek-v4-pro       1M 上下文，最强，审核想更严就用它
  #   deepseek/deepseek-v3.2         163K 上下文，更省
  # 用法（.env）：
  #   TASK_LLM_ADAPTER=openrouter
  #   TASK_LLM_MODEL=deepseek/deepseek-v4.1-flash
  #   AUDIT_LLM_ADAPTER=openrouter
  #   AUDIT_LLM_MODEL=deepseek/deepseek-v4-pro
  openrouter:
    base_url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    timeout_seconds: ${OPENROUTER_TIMEOUT_SECONDS:300}
    max_tokens: ${OPENROUTER_MAX_TOKENS}
    api_key: ${OPENROUTER_API_KEY}
    # 可选：OpenRouter 后台用来区分来源的署名头，不填就不发
    referer: ${OPENROUTER_REFERER}
    title: ${OPENROUTER_TITLE:Task Closed Loop}
    # 可选：low / medium / high；不填就不发 reasoning 字段
    reasoning_effort: ${OPENROUTER_REASONING_EFFORT}
  deepseek:
    base_url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    timeout_seconds: ${DEEPSEEK_TIMEOUT_SECONDS:120}
    max_tokens: ${DEEPSEEK_MAX_TOKENS}
    api_key: ${DEEPSEEK_API_KEY}
    thinking: ${DEEPSEEK_THINKING:enabled}
    reasoning_effort: ${DEEPSEEK_REASONING_EFFORT:high}
